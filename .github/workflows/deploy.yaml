on:
  push:
    branches:
      - "main" # change to the branch you wish to deploy from

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2.2.0
      with:
        install_command: bun run install
    - id: build-publish
      uses: bitovi/github-actions-angular-to-github-pages@v1.2.0
      with:
        path: dist/${{ github.event.repository.name }}/browser
        build_command: bun run build -- --base-href=/${{ github.event.repository.name }}/
